log:
  level: info

runner:
  capacity: 2
  timeout: 3h
  shutdown_timeout: 30s
  labels:
    - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-22.04"
    - "self-hosted:host"

cache:
  enabled: true
  dir: /data/cache

container:
  # Caches kept between jobs, because a job container is fresh every run.
  # Uncomment and fill in the real path — `make cache` prints this line with it
  # already filled in. Why these two and not actions/cache: see ../README.md.
  #
  #   mise    the JDK (173 MB), shellcheck, oxipng
  #   gradle  the dependency cache and the build cache
  #
  # options: >-
  #   --volume /home/USER/forgejo-runner/cache/mise:/root/.local/share/mise
  #   --volume /home/USER/forgejo-runner/cache/gradle:/root/.gradle
  options:

  docker_host: 'automount'
  privileged: false
  force_pull: true
  valid_volumes:
    - /data/**

server:
  connections:
    forgejo:
      url: 'https://git.insuit.cz/'
      uuid: '<UUID from Forgejo UI>'
      token: '<TOKEN from Forgejo UI>'
